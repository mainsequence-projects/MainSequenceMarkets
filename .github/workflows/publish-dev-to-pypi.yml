name: Publish development release to PyPI

on:
  push:
    branches: [development]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-dev-to-pypi
  cancel-in-progress: true

jobs:
  checks:
    if: github.ref == 'refs/heads/development'
    uses: ./.github/workflows/checks.yml

  publish:
    needs: checks
    runs-on: ubuntu-latest
    environment: pypi-development
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install uv and locked build tools
        run: |
          python -m pip install uv==0.10.4
          uv sync --frozen --all-extras
      - name: Compute the development version for this build
        id: version
        run: |
          version="$(.venv/bin/python scripts/dev_release_version.py --run-number "$GITHUB_RUN_NUMBER" --write)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Publishing ms-markets $version from $GITHUB_SHA." >> "$GITHUB_STEP_SUMMARY"
      # Invoke the installed interpreter directly after the temporary version
      # edit: uv sync/run would try to reconcile it with the stable lockfile.
      - name: Build and verify the computed version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          .venv/bin/python -m build
          .venv/bin/python -m scripts.check_distribution_sources --expected-version "$VERSION"
          .venv/bin/python -m twine check --strict dist/*
      - name: Publish to PyPI using trusted publishing
        uses: pypa/gh-action-pypi-publish@release/v1
