name: Package and static checks

on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Package and static checks
    runs-on: ubuntu-latest
    concurrency:
      group: checks-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13.17'
      - name: Install locked tools
        run: |
          python -m pip install --upgrade 'pip @ https://files.pythonhosted.org/packages/3f/06/3e4420302363fbb71be3c7f35ce042f54bfca330e3e66b3a2e3c4cca579f/pip-26.2.2-py3-none-any.whl#sha256=fd7f4dfa8190e014013b9f08f3e973f4e4c26ffd179a204895533a7254813a70'
          python -m pip install uv==0.13.4
          uv lock --check
          uv sync --frozen --all-extras
      - name: Check source and documentation
        run: |
          uv run --frozen --all-extras ruff check --no-fix .
          uv run --frozen --all-extras mkdocs build --strict
      - name: Run the test suite
        run: uv run --frozen --all-extras pytest -q
      - name: Build and verify distributions
        run: |
          uv run --frozen --all-extras python -m build
          uv run --frozen --all-extras python -m scripts.check_distribution_sources
          uv run --frozen --all-extras python -m twine check --strict dist/*
