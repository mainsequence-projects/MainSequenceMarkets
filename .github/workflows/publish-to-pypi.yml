name: Publish Python Package to PyPI

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: publish-to-pypi
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  deploy:
    needs: checks
    runs-on: ubuntu-latest
    environment: pypi
    outputs:
      version: ${{ steps.version.outputs.version }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install uv and locked build tools
        run: |
          python -m pip install uv==0.10.4
          uv sync --frozen --all-extras
      - name: Validate the declared final version
        id: version
        run: |
          version="$(.venv/bin/python scripts/dev_release_version.py --final)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing ms-markets $version from $GITHUB_SHA." >> "$GITHUB_STEP_SUMMARY"
      - name: Refuse an existing release tag on another commit
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          tagged="$(git ls-remote --tags origin "refs/tags/v$VERSION" "refs/tags/v$VERSION^{}" | tail -n 1 | cut -f 1)"
          if [ -n "$tagged" ] && [ "$tagged" != "$GITHUB_SHA" ]; then
            echo "::error::Tag v$VERSION points at another commit: $tagged."
            exit 1
          fi
      - name: Build and verify distributions
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          .venv/bin/python -m build
          .venv/bin/python -m scripts.check_distribution_sources --expected-version "$VERSION"
          .venv/bin/python -m twine check --strict dist/*
      - name: Publish to PyPI using trusted publishing
        uses: pypa/gh-action-pypi-publish@release/v1

  tag:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create the release tag and GitHub release after upload
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: v${{ needs.deploy.outputs.version }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists."
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --generate-notes
          fi

  docs:
    needs: deploy
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/docs.yml

  next-version:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: development
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install version tooling
        run: python -m pip install uv==0.10.4 'packaging>=24.2'
      - name: Return the release merge and next patch version to development
        env:
          RELEASED: ${{ needs.deploy.outputs.version }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git merge --no-edit "$GITHUB_SHA"
          declared="$(python -c 'import pathlib, tomllib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
          if [ "$declared" = "$RELEASED" ]; then
            next="$(python scripts/dev_release_version.py --bump-patch)"
            uv lock
            git add -- pyproject.toml uv.lock
            git commit -m "Declare $next as the next release after $RELEASED"
          fi
          git push origin HEAD:development
