<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="680" viewBox="0 0 1240 680" role="img" aria-labelledby="f17-title f17-desc">
  <title id="f17-title">How a table's search document is built</title>
  <desc id="f17-desc">A metadata write rebuilds the table's search document in the same catalog transaction. The API reads the table, its labels, its namespace and every column, never other tables' names, writes the document and its hash to meta_table_search_document, and derives keyword terms from it at once. In the background the document is cut into chunks that fit 512 tokens, embedded with bge-small-en-v1.5 and stored in meta_table_search_vector, one row per chunk.</desc>
  <style>
    .sans { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .title { font-size: 21px; font-weight: 700; fill: #0f172a; }
    .sub { font-size: 13.5px; fill: #475569; }
    .head { font-size: 15px; font-weight: 700; fill: #0f172a; }
    .step { font-size: 13px; font-weight: 700; fill: #0f172a; }
    .msg { font-size: 12.5px; font-weight: 600; fill: #0f172a; }
    .note { font-size: 12.5px; fill: #475569; }
    .code { font-size: 12px; fill: #0f172a; }
    .deny { fill: #b91c1c; font-weight: 700; }
  </style>
  <defs>
    <marker id="f17-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
  </defs>

  <rect x="0" y="0" width="1240" height="680" rx="16" fill="#ffffff"/>

  <text x="40" y="48" class="sans title">How a table's search document is built</text>
  <text x="40" y="74" class="sans sub">A metadata write rebuilds the document in its catalog transaction. Vectors follow in the background.</text>

  <!-- 1. Trigger -->
  <rect x="40" y="96" width="1160" height="48" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.2"/>
  <text x="56" y="125" class="sans step">1 · Any metadata write</text>
  <text x="240" y="125" class="sans note">register · patch · label change · import · finalize · contract update · namespace description change</text>
  <line x1="600" y1="144" x2="600" y2="210" stroke="#334155" stroke-width="1.8" marker-end="url(#f17-arrow)"/>

  <!-- Catalog rows -->
  <text x="40" y="196" class="sans head">Read from the catalog</text>

  <rect x="40" y="212" width="320" height="70" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.1"/>
  <text x="56" y="236" class="sans step">MetaTable</text>
  <text x="56" y="256" class="sans note">identifier, physical name, description,</text>
  <text x="56" y="274" class="sans note">time index and cadence</text>

  <rect x="40" y="294" width="320" height="52" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.1"/>
  <text x="56" y="316" class="sans step">Labels</text>
  <text x="56" y="336" class="sans note">label names</text>

  <rect x="40" y="358" width="320" height="52" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.1"/>
  <text x="56" y="380" class="sans step">Namespace</text>
  <text x="56" y="400" class="sans note">name, description</text>

  <rect x="40" y="422" width="320" height="70" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.1"/>
  <text x="56" y="446" class="sans step">Columns, every one</text>
  <text x="56" y="466" class="sans note">name, type, logical name, label,</text>
  <text x="56" y="484" class="sans note">description</text>

  <rect x="40" y="508" width="320" height="52" rx="10" fill="#ffffff" stroke="#b91c1c" stroke-width="1.1" stroke-dasharray="6 4"/>
  <text x="56" y="530" class="sans step"><tspan class="deny">Never read</tspan></text>
  <text x="56" y="550" class="sans note">names of other tables, which may be hidden</text>

  <line x1="362" y1="330" x2="438" y2="330" stroke="#334155" stroke-width="1.8" marker-end="url(#f17-arrow)"/>
  <text x="400" y="321" text-anchor="middle" class="sans msg">read</text>

  <!-- 2. Build -->
  <rect x="440" y="212" width="320" height="196" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.2"/>
  <text x="456" y="236" class="sans step">2 · Build the document</text>
  <text x="456" y="260" class="sans note">in the same catalog transaction</text>
  <text x="456" y="282" class="sans note">sections in fixed order:</text>
  <text x="456" y="302" class="mono code"># Table, # Namespace, # Columns</text>
  <text x="456" y="324" class="sans note">one line per column, in column order</text>
  <text x="456" y="346" class="sans note">empty fields are left out</text>
  <text x="456" y="368" class="sans note">document hash: SHA-256 of the text</text>

  <line x1="600" y1="408" x2="600" y2="444" stroke="#334155" stroke-width="1.8" marker-end="url(#f17-arrow)"/>

  <rect x="440" y="446" width="320" height="64" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.2"/>
  <text x="456" y="470" class="mono step">meta_table_search_document</text>
  <text x="456" y="492" class="sans note">document, document hash, updated time</text>

  <line x1="760" y1="468" x2="838" y2="300" stroke="#334155" stroke-width="1.8" marker-end="url(#f17-arrow)"/>
  <line x1="760" y1="488" x2="838" y2="470" stroke="#334155" stroke-width="1.8" marker-end="url(#f17-arrow)"/>

  <!-- 3a. Keyword terms -->
  <rect x="840" y="212" width="360" height="150" rx="10" fill="#ffffff" stroke="#4f46e5" stroke-width="1.2"/>
  <text x="856" y="236" class="sans step">3a · Keyword terms</text>
  <text x="856" y="258" class="sans note">built by the API process from the document</text>
  <text x="856" y="280" class="sans note">split identifiers: <tspan class="mono code">clean_price → clean, price</tspan></text>
  <text x="856" y="302" class="sans note">stem words: <tspan class="mono code">prices → price</tspan></text>
  <text x="856" y="324" class="sans note">table fields weigh more than column fields</text>
  <text x="856" y="346" class="sans note">searchable as soon as the write commits</text>

  <!-- 3b. Chunks and vectors -->
  <rect x="840" y="388" width="360" height="176" rx="10" fill="#ffffff" stroke="#4f46e5" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="856" y="412" class="sans step">3b · Chunks and vectors, in the background</text>
  <text x="856" y="436" class="sans note">chunk 0: the <tspan class="mono code"># Table</tspan> and <tspan class="mono code"># Namespace</tspan> sections</text>
  <text x="856" y="458" class="sans note">chunks 1…n: table header + a group of columns</text>
  <text x="856" y="480" class="sans note">each chunk fits the model's 512 tokens</text>
  <text x="856" y="502" class="sans note">embedded with <tspan class="mono code">bge-small-en-v1.5</tspan>, 384 dims</text>
  <text x="856" y="524" class="sans note">redone when the document hash or model changes</text>

  <line x1="1020" y1="564" x2="1020" y2="590" stroke="#334155" stroke-width="1.8" marker-end="url(#f17-arrow)"/>

  <rect x="840" y="592" width="360" height="64" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.2"/>
  <text x="856" y="616" class="mono step">meta_table_search_vector</text>
  <text x="856" y="638" class="sans note">one row per chunk: model, document hash, vector</text>

  <!-- Footer -->
  <text x="40" y="600" class="sans note">Search ranks the tables the caller can see with the keyword terms and the vectors.</text>
  <text x="40" y="622" class="sans note">Until a table's vectors match its document hash, it is ranked by keywords only.</text>
</svg>
