<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="740" viewBox="0 0 1240 740" role="img" aria-labelledby="ns-title ns-desc">
  <title id="ns-title">Namespaces are access groups, not application boundaries</title>
  <desc id="ns-desc">In one Environment, the workload Users of the prices application are members of the Team prices-development, which is Writer on namespace prices. The workload Users of the trading application are members of trading-development, which is Writer on namespace trading and Reader on namespace prices. Registering a table in a namespace requires Writer on it or admin. Reading or writing a table requires a grant on the table or its namespace, checked by the API and by the database. Which project's tables go in which namespace is not checked.</desc>
  <style>
    .sans { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .title { font-size: 22px; font-weight: 700; fill: #0f172a; }
    .sub { font-size: 14px; fill: #475569; }
    .col { font-size: 11.5px; font-weight: 700; fill: #64748b; letter-spacing: 0.08em; }
    .name { font-size: 14px; font-weight: 700; fill: #0f172a; }
    .small { font-size: 12px; fill: #64748b; }
    .table { font-size: 12.5px; fill: #1e293b; }
    .note { font-size: 13px; fill: #334155; }
    .head { font-size: 15px; font-weight: 700; fill: #0f172a; }
    .tag { font-size: 11.5px; font-weight: 700; letter-spacing: 0.08em; }
    .label { font-size: 12.5px; font-weight: 700; }
    .box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
    .team { fill: #f1f5f9; stroke: #64748b; stroke-width: 1.5; }
    .ns { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.5; }
    .pill { fill: #f8fafc; stroke: #e2e8f0; stroke-width: 1; }
    .member { fill: none; stroke: #64748b; stroke-width: 1.6; marker-end: url(#ns-arrow-member); }
    .writer { fill: none; stroke: #c2410c; stroke-width: 2.4; marker-end: url(#ns-arrow-writer); }
    .reader { fill: none; stroke: #1d4ed8; stroke-width: 2.4; stroke-dasharray: 7 5; marker-end: url(#ns-arrow-reader); }
  </style>
  <defs>
    <marker id="ns-arrow-member" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker>
    <marker id="ns-arrow-writer" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c2410c"/></marker>
    <marker id="ns-arrow-reader" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1d4ed8"/></marker>
  </defs>
  <rect width="1240" height="740" rx="16" fill="#f8fafc"/>
  <text x="40" y="48" class="sans title">Namespaces are access groups, not application boundaries</text>
  <text x="40" y="74" class="sans sub">One Environment · Teams own namespaces · every check is on the caller's identity, never on its project</text>

  <text x="40" y="114" class="sans col">WORKLOAD USERS</text>
  <text x="380" y="114" class="sans col">PLATFORM TEAMS</text>
  <text x="760" y="114" class="sans col">METATABLES NAMESPACES AND TABLES</text>

  <!-- prices application -->
  <rect x="40" y="135" width="260" height="44" rx="8" class="box"/>
  <text x="56" y="162" class="sans name">prices migration Job</text>
  <rect x="40" y="195" width="260" height="44" rx="8" class="box"/>
  <text x="56" y="222" class="sans name">prices API</text>
  <path d="M 300 157 L 378 179" class="member"/>
  <path d="M 300 217 L 378 196" class="member"/>
  <rect x="380" y="159" width="230" height="56" rx="10" class="team"/>
  <text x="396" y="184" class="mono name">prices-development</text>
  <text x="396" y="203" class="sans small">Team</text>

  <path d="M 610 187 L 758 187" class="writer"/>
  <text x="684" y="178" class="sans label" fill="#c2410c" text-anchor="middle">Writer</text>

  <rect x="760" y="128" width="440" height="128" rx="12" class="ns"/>
  <text x="780" y="153" class="sans small">namespace</text>
  <text x="852" y="153" class="mono name">prices</text>
  <rect x="780" y="166" width="400" height="24" rx="6" class="pill"/>
  <text x="792" y="183" class="mono table">prices.alembic_version</text>
  <rect x="780" y="196" width="400" height="24" rx="6" class="pill"/>
  <text x="792" y="213" class="mono table">prices.daily_close</text>
  <rect x="780" y="226" width="400" height="24" rx="6" class="pill"/>
  <text x="792" y="243" class="mono table">prices.intraday</text>

  <!-- trading application -->
  <rect x="40" y="365" width="260" height="44" rx="8" class="box"/>
  <text x="56" y="392" class="sans name">trading migration Job</text>
  <rect x="40" y="425" width="260" height="44" rx="8" class="box"/>
  <text x="56" y="452" class="sans name">trading API</text>
  <path d="M 300 387 L 378 409" class="member"/>
  <path d="M 300 447 L 378 426" class="member"/>
  <rect x="380" y="389" width="230" height="56" rx="10" class="team"/>
  <text x="396" y="414" class="mono name">trading-development</text>
  <text x="396" y="433" class="sans small">Team</text>

  <path d="M 610 425 L 758 425" class="writer"/>
  <text x="684" y="448" class="sans label" fill="#c2410c" text-anchor="middle">Writer</text>

  <path d="M 610 403 C 680 403, 690 262, 758 248" class="reader"/>
  <text x="702" y="318" class="sans label" fill="#1d4ed8">Reader</text>
  <text x="702" y="334" class="sans small">every current and</text>
  <text x="702" y="349" class="sans small">future prices table</text>

  <rect x="760" y="380" width="440" height="98" rx="12" class="ns"/>
  <text x="780" y="405" class="sans small">namespace</text>
  <text x="852" y="405" class="mono name">trading</text>
  <rect x="780" y="418" width="400" height="24" rx="6" class="pill"/>
  <text x="792" y="435" class="mono table">trading.alembic_version</text>
  <rect x="780" y="448" width="400" height="24" rx="6" class="pill"/>
  <text x="792" y="465" class="mono table">trading.orders</text>

  <text x="40" y="510" class="sans small">A new workload User, after a new Environment or a recreated Job, only needs Team membership. The namespaces and their tables keep their owner.</text>

  <!-- checks -->
  <rect x="40" y="540" width="373" height="170" rx="12" class="box"/>
  <text x="58" y="570" class="sans tag" fill="#15803d">ENFORCED</text>
  <text x="58" y="596" class="sans head">Registering a table in a namespace</text>
  <text x="58" y="622" class="sans note">The caller must be a Writer of the namespace,</text>
  <text x="58" y="642" class="sans note">directly or through a Team, or an admin.</text>
  <text x="58" y="662" class="sans note">Otherwise: 403 namespace_not_writable.</text>
  <text x="58" y="682" class="sans note">A Writer's new table gets no grant of its own.</text>

  <rect x="433" y="540" width="373" height="170" rx="12" class="box"/>
  <text x="451" y="570" class="sans tag" fill="#15803d">ENFORCED</text>
  <text x="451" y="596" class="sans head">Reading or writing a table</text>
  <text x="451" y="622" class="sans note">A grant on the table or on its namespace,</text>
  <text x="451" y="642" class="sans note">to the caller or one of its Teams. Checked</text>
  <text x="451" y="662" class="sans note">by the API and by the caller's own role in</text>
  <text x="451" y="682" class="sans note">the database.</text>

  <rect x="826" y="540" width="374" height="170" rx="12" class="box"/>
  <text x="844" y="570" class="sans tag" fill="#b91c1c">NOT ENFORCED</text>
  <text x="844" y="596" class="sans head">Which project uses which namespace</text>
  <text x="844" y="622" class="sans note">Any Writer of prices can register tables there</text>
  <text x="844" y="642" class="sans note">from any project. A project may use several</text>
  <text x="844" y="662" class="sans note">namespaces or share one. One namespace per</text>
  <text x="844" y="682" class="sans note">application is a recommendation.</text>
</svg>
